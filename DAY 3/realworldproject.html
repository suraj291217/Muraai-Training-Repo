<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Store</title>

    <link rel="stylesheet" href="realworldproject.css" />
  </head>

  <body>
    <header class="navbar">
      <h1>MyStore</h1>

      <nav>
        <a href="#">Home</a>
        <a href="#">Products</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h2>Welcome to MyStore</h2>

        <p>Find the best products at the best prices.</p>

        <button>Shop Now</button>
      </section>

      <section class="products">
        <article class="card">
          <h3>Laptop</h3>

          <p>Powerful laptop for developers.</p>

          <strong>₹60,000</strong>

          <button>Buy Now</button>
        </article>

        <article class="card">
          <h3>Smartphone</h3>

          <p>Latest smartphone with great camera.</p>

          <strong>₹25,000</strong>

          <button>Buy Now</button>
        </article>

        <article class="card">
          <h3>Headphones</h3>

          <p>Wireless noise cancelling headphones.</p>

          <strong>₹3,000</strong>

          <button>Buy Now</button>
        </article>
      </section>
    </main>

    <footer>
      <p>© 2026 MyStore</p>
    </footer>
  </body>
</html>
